server {
    listen 80;
    server_name localhost;

    # Servir os arquivos estáticos do React (Front-end)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Importante para Single Page Applications (React Router)
        try_files $uri $uri/ /index.html;
    }

    # Redirecionar /api (backend em Python/FastAPI)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PROXY MÁGICO PARA A API DA ANA (Resolve o problema do CORS)
    location /api/ana/ {
        # O Nginx vai capturar chamadas para seu-site.com/api/ana e repassar para a ANA
        proxy_pass https://www.ana.gov.br/hidrowebservice/;
        
        # Reescreve os cabeçalhos para fingir que a requisição está saindo de um servidor legítimo
        proxy_set_header Host www.ana.gov.br;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        
        # Evitar problemas de buffer e timeout com SOAP/XML pesado
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}
